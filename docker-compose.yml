services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_boutique_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/aura_boutique
      - JWT_SECRET=${JWT_SECRET:-aura_super_secure_jwt_secret_key_2026}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7-jammy
    container_name: aura_boutique_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
